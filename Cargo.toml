[package]
name = "wisp"
version = "0.1.2"
edition = "2021"
description = "Featherweight keyboard & mouse sharing across computers"
license = "MIT"
repository = "https://github.com/xfun-dev/wisp"

[features]
# the developer bridge (RULES.md X1): scripts/deploy.sh builds with it, releases never do
bridge = []

[dependencies]
chacha20poly1305 = { version = "0.10.1", default-features = false }
sha2 = { version = "0.10.8", default-features = false }
getrandom = "0.2.15"
# pairing: turns a 6-digit code into a shared key without exposing it to offline guessing
spake2 = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
